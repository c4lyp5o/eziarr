# ez standard test workflow: lint, tests and build, plus the Docker image
# built, booted and healthy. Runs on PRs and on pushes to development;
# publish.yml calls it before every publish.
name: test

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Tests
        run: bun test

  frontend:
    name: Frontend lint, tests, build & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧹 Lint & format
        working-directory: .
        run: bun install --frozen-lockfile && bunx biome ci frontend
      - name: 🧪 Unit tests
        run: bun run test:unit
      - name: 🏗️ Build
        run: bun run build
      - name: 🌐 Browser smoke test
        run: bun run smoke

  docker:
    name: Docker image (build, boot, healthy)
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛠️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: eziarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 🔬 Boot and wait for healthy
        run: |
          set -euo pipefail
          docker run -d --name app eziarr:ci
          status=starting
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "::error::container exited"; exit 1; }
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          test "$(docker exec app id -u)" = "1000"
      - name: 🧾 Container logs
        if: always()
        run: docker logs app || true
