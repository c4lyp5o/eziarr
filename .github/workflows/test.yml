name: Test

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as the Docker image (Dockerfile) runs in production.
          bun-version: 1.4.3

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # bunfig.toml preloads tests/setup.js, so tests use a throwaway
      # database, log and download directory.
      - name: 🧪 Run tests
        run: bun test

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Lint and formatting (biome.json); never writes in CI.
      - name: 🧹 Lint
        run: bunx biome ci

      - name: 🏗️ Build
        run: bun run build
