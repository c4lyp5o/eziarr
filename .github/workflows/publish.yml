# ez standard publish workflow (identical in every ez repo apart from IMAGE).
#   push to master  -> test, then :latest, :<package.json version>, :sha-<commit>
#   push tag vX.Y.Z -> test, check the tag matches package.json, then :<version>
#                      and a GitHub Release with the CHANGELOG section (plus
#                      scripts/release-assets.sh output when the repo has one)
# development publishes nothing.
name: publish

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/c4lyp5o/eziarr

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7

      - name: 🏷️ Version
        id: v
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/master' }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GHCR
        if: startsWith(env.IMAGE, 'ghcr.io/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub
        if: startsWith(env.IMAGE, 'docker.io/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            APP_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## /{exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md

      - name: 🥟 Set up Bun (release files)
        if: github.ref_type == 'tag' && hashFiles('scripts/release-assets.sh') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 📦 Release files
        if: github.ref_type == 'tag' && hashFiles('scripts/release-assets.sh') != ''
        run: sh scripts/release-assets.sh "${{ github.ref_name }}"

      - name: 📦 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: false

      - name: 🔔 Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -n "$NTFY_URL" ]; then
            curl -fsS \
              -H "Title: Publish ${{ job.status }}: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}" \
              -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }},rocket" \
              -d "Ref: ${{ github.ref_name }} | Commit: ${{ github.sha }}" \
              "$NTFY_URL" || true
          fi
