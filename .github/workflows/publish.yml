# ez standard publish workflow (identical in every ez repo apart from IMAGE).
#   push to development -> test, then :development and :sha-<commit> (never
#                          :latest or a version, so it can't replace a release)
#   push to master      -> test, then :latest, :<package.json version>, :sha-<commit>
#   push tag vX.Y.Z     -> test, check the tag matches package.json, then :<version>
#                          and a GitHub Release with the CHANGELOG section (plus
#                          scripts/release-assets.sh output when the repo has one)
name: publish

on:
  push:
    branches: [master, development]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/c4lyp5o/eziarr

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    # A manual run from any other branch tests but never publishes.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7

      - name: 🏷️ Version
        id: v
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ github.ref == 'refs/heads/master' || github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            APP_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## /{exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md

      - name: 🥟 Set up Bun (release files)
        if: github.ref_type == 'tag' && hashFiles('scripts/release-assets.sh') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 📦 Release files
        if: github.ref_type == 'tag' && hashFiles('scripts/release-assets.sh') != ''
        run: sh scripts/release-assets.sh "${{ github.ref_name }}"

      - name: 📦 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: false

  # One message per run to the NTFY_URL topic (docker_builds), covering the
  # tests as well as the publish, so a red test run is reported too.
  notify:
    needs: [test, publish]
    if: always() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Notify ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          APP: ${{ github.event.repository.name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TEST: ${{ needs.test.result }}
          PUBLISH: ${{ needs.publish.result }}
          VERSION: ${{ needs.publish.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_URL" ] || { echo "NTFY_URL not set; skipping"; exit 0; }
          case "$REF" in
            development) tags=":development" ;;
            master) tags=":latest, :$VERSION" ;;
            *) tags=":$VERSION + GitHub Release" ;;
          esac
          if [ "$PUBLISH" = success ]; then
            title="✅ $APP $REF published"; prio=default; emoji=white_check_mark
            body="$IMAGE $tags (${SHA:0:7})"
          elif [ "$TEST" != success ]; then
            title="❌ $APP $REF: tests failed"; prio=high; emoji=x
            body="Nothing published (${SHA:0:7})"
          else
            title="❌ $APP $REF: publish failed"; prio=high; emoji=x
            body="Tests passed, image push failed (${SHA:0:7})"
          fi
          curl -fsS -H "Title: $title" -H "Priority: $prio" -H "Tags: $emoji,whale" \
            -H "Click: $RUN_URL" -d "$body" "$NTFY_URL" >/dev/null || echo "::warning::ntfy post failed"
